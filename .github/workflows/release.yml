name: Release

# Builds the verdifax-verify CLI for all supported platforms and uploads
# each binary to the GitHub release that triggered this workflow.
#
# Trigger: pushing a tag matching v*. Example to cut a release:
#
#   git tag v0.1.5 -m "v0.1.5 — short description"
#   git push origin v0.1.5
#
# Two-stage shape (avoids the race condition that broke v0.1.4):
#
#   1. create-release  runs ONCE, creates the GitHub release for the tag.
#   2. build           matrix job, runs FOUR times (one per platform),
#                      each builds its binary and uploads to the existing
#                      release. Because the release already exists by
#                      this point, softprops/action-gh-release@v2 takes
#                      the "upload-only" branch and the jobs do not race.
#
# Naming convention (matches the audit PDF's install commands):
#   verdifax-verify-darwin-amd64
#   verdifax-verify-darwin-arm64
#   verdifax-verify-linux-amd64
#   verdifax-verify-linux-arm64
#
# The names are literal (no $(uname) shell substitution) because the
# audit PDF embeds them as static clickable URLs.
#
# SLSA Build Level 3 provenance: after the matrix uploads, the
# hashes job computes a checksum manifest of the four binaries and
# hands it to the official slsa-github-generator reusable workflow,
# which builds and signs the provenance in ITS trusted environment,
# not this workflow's. That isolation is what makes the provenance
# non-forgeable even by a compromised copy of this file, and it is
# the requirement that separates Level 3 from Level 2. Verify with:
#
#   slsa-verifier verify-artifact <binary> \
#     --provenance-path verdifax-verify-<tag>.intoto.jsonl \
#     --source-uri github.com/Verdifax/verdifax-verify \
#     --source-tag <tag>

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # required to create / update the release
  id-token: write  # Cosign keyless signing (Sigstore OIDC identity)

jobs:
  create-release:
    name: Create release for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: create-release
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          check-latest: true
          cache: true

      - name: Build verdifax-verify
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o dist/verdifax-verify-${{ matrix.goos }}-${{ matrix.goarch }} \
            .

      - name: Generate SHA-256 checksum
        run: |
          cd dist
          sha256sum verdifax-verify-${{ matrix.goos }}-${{ matrix.goarch }} \
            > verdifax-verify-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing: the signature is bound to this workflow's
      # GitHub OIDC identity and recorded on the public Sigstore
      # transparency log. No private key exists to manage or leak.
      # Emits a single Sigstore bundle (.bundle) — the modern format
      # containing the signature, certificate, and transparency-log
      # entry together. A third party verifies with:
      #
      #   cosign verify-blob \
      #     --bundle <binary>.bundle \
      #     --certificate-identity-regexp '^https://github.com/Verdifax/verdifax-verify/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     <binary>
      - name: Sign binary (Cosign keyless, Sigstore bundle)
        env:
          COSIGN_YES: "true"
        run: |
          cd dist
          cosign sign-blob \
            --bundle verdifax-verify-${{ matrix.goos }}-${{ matrix.goarch }}.bundle \
            verdifax-verify-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/verdifax-verify-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/verdifax-verify-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
            dist/verdifax-verify-${{ matrix.goos }}-${{ matrix.goarch }}.bundle

  # Collect the four published binaries and emit the base64 checksum
  # manifest the SLSA generator takes as its subjects.
  hashes:
    name: Compute provenance subjects
    runs-on: ubuntu-latest
    needs: build
    outputs:
      hashes: ${{ steps.subjects.outputs.hashes }}
    steps:
      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'verdifax-verify-*'
          rm -f ./*.sha256 ./*.bundle

      - name: Emit base64 subjects
        id: subjects
        run: |
          sha256sum verdifax-verify-* > checksums.txt
          cat checksums.txt
          echo "hashes=$(base64 -w0 checksums.txt)" >> "$GITHUB_OUTPUT"

  # SLSA Build Level 3 provenance, generated and signed by the SLSA
  # project's trusted reusable workflow (pinned by release tag, as
  # the generator requires) and uploaded to the same release.
  provenance:
    name: Generate SLSA3 provenance
    needs: hashes
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.hashes.outputs.hashes }}
      provenance-name: verdifax-verify-${{ github.ref_name }}.intoto.jsonl
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}
