name: test

# The verifier is the trust anchor: the audit-of-record claim rests on
# anyone being able to recompute bundles offline with this CLI. This
# workflow runs vet + build + the full test suite (canonical hash
# known-answer, deny-receipt, and the production golden-bundle test)
# on every push and PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow calls this one and builds nothing unless it
  # passes, so no release ships from a commit whose tests fail.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          check-latest: true
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        # The tamper tests verify thousands of changed records; under the
        # race detector that takes longer than go test's 10-minute default.
        run: go test -race -timeout 30m ./...

      # Known-vulnerability scan of the module and its (stdlib-only)
      # dependency surface; fails the build on any reachable vuln.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
