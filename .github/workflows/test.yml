name: test

# The verifier is the trust anchor: the audit-of-record claim rests on
# anyone being able to recompute bundles offline with this CLI. This
# workflow runs vet + build + the full test suite (canonical hash
# known-answer, deny-receipt, and the production golden-bundle test)
# on every push and PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.2"
          check-latest: true
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      # Known-vulnerability scan of the module and its (stdlib-only)
      # dependency surface; fails the build on any reachable vuln.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
